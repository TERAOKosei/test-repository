name: Check Parent Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  check-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 分岐元の比較に必要なため、すべてのコミット履歴を取得する
          fetch-depth: 0

      - name: Verify parent is main
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # main ブランチの最新状態を取得
          git fetch origin main

          # PR ブランチと origin/main の共通の先祖（分岐点）を取得
          BRANCH_POINT=$(git merge-base "$PR_HEAD_SHA" origin/main)

          # origin/main の最新コミットハッシュを取得
          MAIN_HEAD=$(git rev-parse origin/main)

          echo "PR Head SHA:  $PR_HEAD_SHA"
          echo "Branch Point: $BRANCH_POINT"
          echo "Main HEAD:     $MAIN_HEAD"

          # 分岐点が main の HEAD と一致しない場合はエラーにする
          if [ "$BRANCH_POINT" != "$MAIN_HEAD" ]; then
            echo "::error::このブランチは main の最新状態から分岐していません。main を pull / rebase してから再度お試しください。"
            exit 1
          fi

          echo "Check passed: Branch is properly based on the latest main."
          
