name: Check Parent Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  check-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 分岐元の比較に必要なため、すべてのコミット履歴を取得する
          fetch-depth: 0

      - name: Verify parent is main
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # main ブランチの最新状態を取得
          git fetch origin main

          # origin/main の最新コミットハッシュを取得
          MAIN_HEAD=$(git rev-parse origin/main)

          echo "PR Head SHA:  $PR_HEAD_SHA"
          echo "Main HEAD:     $MAIN_HEAD"

          # origin/main の最新コミットが PR ブランチの履歴（祖先）に含まれているか検証
          if ! git merge-base --is-ancestor "$MAIN_HEAD" "$PR_HEAD_SHA"; then
            echo "::error::最新の main が取り込まれていません。main から rebase するか、git merge origin/main を行って最新状態を取り込んでください。"
            exit 1
          fi

          echo "Check passed: Branch is properly based on the latest main."
          
